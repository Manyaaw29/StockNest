<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockNest — Organization Setup</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="organisation.css">
</head>
<body>

  <div class="app-shell">
    <!-- Sidebar component target -->
    <aside id="sidebar-root" class="app-shell__sidebar"></aside>

    <div class="app-shell__main">
      <!-- Topbar component target -->
      <div id="topbar-root" class="app-shell__topbar"></div>

      <!-- Page content mounts here -->
      <main id="page-content" class="page-content"></main>
    </div>
  </div>

<!-- Templates for each page -->
<template id="tpl-setup">
  <div class="page-head">
    <h1>Organization Setup</h1>
    <p>Configure physical hierarchies, manage branch details, and analyze spatial distributions.</p>
  </div>

  <div class="grid-top">

    <!-- Organization Tier -->
    <section class="card tier-card">
      <div class="card-head">
        <h2>Organization Tier</h2>
        <svg class="head-ic" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.3" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.3" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.3" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.3" stroke="currentColor" stroke-width="1.6"/></svg>
      </div>

      <label class="tier-option">
        <input type="radio" name="tier">
        <div class="tier-radio"></div>
        <div class="tier-copy">
          <div class="tier-name">Basic</div>
          <div class="tier-desc">Single location, up to 1,000 assets.</div>
        </div>
      </label>

      <label class="tier-option selected">
        <input type="radio" name="tier" checked>
        <div class="tier-radio"></div>
        <div class="tier-copy">
          <div class="tier-name">Professional <span class="badge">CURRENT</span></div>
          <div class="tier-desc">Multi-branch, advanced reporting.</div>
        </div>
      </label>

      <label class="tier-option">
        <input type="radio" name="tier">
        <div class="tier-radio"></div>
        <div class="tier-copy">
          <div class="tier-name">Enterprise</div>
          <div class="tier-desc">Unlimited hierarchy, API access.</div>
        </div>
      </label>
    </section>

    <!-- Branch Details -->
    <section class="card branch-card">
      <div class="card-head">
        <div>
          <h2>Branch Details</h2>
          <div class="eyebrow">NY FLAGSHIP HUB</div>
        </div>
        <button class="icon-btn edit-btn" aria-label="Edit branch">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 20h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="field">
        <label>Branch Name</label>
        <input type="text" value="NY Flagship Hub">
      </div>

      <div class="field-row">
        <div class="field">
          <label>Branch ID</label>
          <div class="prefixed-input">
            <span class="prefix">BR-</span>
            <input type="text" value="NY-001">
          </div>
        </div>
        <div class="field">
          <label>Status</label>
          <input type="text" value="Under Maintenance">
        </div>
      </div>

      <div class="field">
        <label>Address</label>
        <input type="text" value="120 Broadway, Suite 1000">
      </div>

      <div class="field-row">
        <div class="field">
          <input type="text" value="New York">
        </div>
        <div class="field">
          <input type="text" value="10271">
        </div>
      </div>

      <div class="form-actions">
        <button class="btn-ghost">Cancel</button>
        <button class="btn-primary">Save Changes</button>
      </div>
    </section>

    <!-- Geo Sync -->
    <section class="card geo-card">
      <div class="card-head">
        <div class="geo-status"><span class="pulse-dot"></span>GEO-SYNC ACTIVE</div>
        <svg class="head-ic" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 13a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.9 2.9l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.6V19a2 2 0 11-4 0v-.2a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.9-2.9l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.6-1H5a2 2 0 110-4h.2a1.7 1.7 0 001.6-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.9-2.9l.1.1a1.7 1.7 0 001.9.3H11a1.7 1.7 0 001-1.6V3a2 2 0 114 0v.2a1.7 1.7 0 001 1.6 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.9 2.9l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.6 1h.2a2 2 0 110 4h-.2a1.7 1.7 0 00-1.6 1z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </div>

      <div class="map">
        <svg class="map-grid" viewBox="0 0 220 170" preserveAspectRatio="none">
          <defs>
            <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
              <path d="M20 0H0V20" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
            </pattern>
          </defs>
          <rect width="220" height="170" fill="url(#grid)"/>
        </svg>
        <span class="pin" style="left:38%; top:28%;"></span>
        <span class="pin" style="left:56%; top:44%;"></span>
        <span class="pin" style="left:68%; top:70%;"></span>
      </div>

      <div class="qr-row">
        <div class="qr-icon">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="14" width="3" height="3" fill="currentColor"/><rect x="18" y="14" width="3" height="3" fill="currentColor"/><rect x="14" y="18" width="3" height="3" fill="currentColor"/><rect x="18" y="18" width="3" height="3" fill="currentColor"/></svg>
        </div>
        <div>
          <div class="qr-title">Location QR Config</div>
          <div class="qr-sub">Format: [BR-ID]-[FL]-[RM]</div>
        </div>
      </div>

      <button class="btn-primary full">Generate Location Tags</button>
    </section>
  </div>

  <div class="grid-bottom">

    <!-- Location Tree -->
    <section class="card tree-card">
      <div class="card-head">
        <h2>Location Tree</h2>
        <button class="icon-btn add-btn" aria-label="Add location">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>

      <ul class="tree">
        <li class="tree-node depth-0">
          <span class="caret open"></span>
          <svg class="tree-ic" viewBox="0 0 24 24" fill="none"><rect x="4" y="3" width="16" height="18" rx="1.3" stroke="currentColor" stroke-width="1.6"/><path d="M8 8h2M8 12h2M8 16h2M14 8h2M14 12h2M14 16h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Global HQ (Nexus)</span>
        </li>
        <li class="tree-node depth-1">
          <span class="caret open"></span>
          <svg class="tree-ic" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M3 12h18M12 3a15 15 0 010 18M12 3a15 15 0 000 18" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>North America</span>
        </li>
        <li class="tree-node depth-2">
          <span class="caret open"></span>
          <svg class="tree-ic" viewBox="0 0 24 24" fill="none"><rect x="4" y="3" width="16" height="18" rx="1.3" stroke="currentColor" stroke-width="1.6"/><path d="M8 8h2M8 12h2M8 16h2M14 8h2M14 12h2M14 16h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span class="current">NY Flagship Hub</span>
        </li>
        <li class="tree-node depth-3 leaf active-leaf">
          <svg class="tree-ic" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="1.3" stroke="currentColor" stroke-width="1.6"/><path d="M4 9h16" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>Floor 10 (Coworking)</span>
        </li>
        <li class="tree-node depth-3 leaf">
          <svg class="tree-ic" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="1.3" stroke="currentColor" stroke-width="1.6"/><path d="M4 9h16" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>Floor 11 (Studios)</span>
        </li>
      </ul>
    </section>

    <!-- Spatial Asset Distribution -->
    <section class="card spatial-card">
      <div class="card-head">
        <div>
          <h2>Spatial Asset Distribution <svg class="info-ic" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 11v5.5M12 8v.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></h2>
          <div class="eyebrow">FLOOR DENSITY ANALYSIS</div>
        </div>
        <div class="spatial-controls">
          <select class="floor-select">
            <option>Floor 10</option>
            <option>Floor 11</option>
          </select>
          <button class="icon-btn view-toggle" data-view="grid" aria-label="Grid view">
            <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
          <button class="icon-btn view-toggle active" data-view="list" aria-label="List view">
            <svg viewBox="0 0 24 24" fill="none"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>

      <div class="treemap">
        <div class="tile tile-desk">
          <div class="tile-name">Open Desk Area</div>
          <div class="tile-count">245 Assets</div>
        </div>
        <div class="tile tile-meeting">
          <div class="tile-name">Meeting Rooms</div>
          <div class="tile-count">42 Assets</div>
        </div>
        <div class="tile tile-storage">
          <div class="tile-name">IT Storage</div>
          <div class="tile-count">18 Assets</div>
        </div>
      </div>
    </section>
  </div>
</template>

<template id="tpl-placeholder">
  <div class="page-head">
    <h1 data-placeholder-title></h1>
    <p>This section is under construction — check back soon.</p>
  </div>
  <div class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" width="48" height="48"><rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.4"/><path d="M8 15l3-3 2 2 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <p>Nothing to show here yet.</p>
  </div>
</template>

<script type="module" src="organisation.js"></script>
</body>
</html>
