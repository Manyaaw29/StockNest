<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookings — StockNest</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="bookings.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar injected by components/sidebar.js -->
    <div id="sidebar-root"></div>

    <div class="app-shell__main">
      <!-- Topbar injected by components/topbar.js -->
      <div id="topbar-root"></div>

      <main class="page-content">
        <!-- Page header -->
        <div class="page-header">
          <div class="page-header__text">
            <h2 class="page-header__title">Bookings</h2>
            <p class="page-header__subtitle">Create, edit, and track every room booking across your workspace.</p>
          </div>
          <button type="button" id="new-booking-btn" class="btn btn--primary">
            + New Booking
          </button>
        </div>

        <!-- Stats cards row -->
        <section class="stats-row" aria-label="Booking statistics">
          <article class="stat-card">
            <div class="stat-card__icon stat-card__icon--upcoming" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
            </div>
            <div class="stat-card__content">
              <span class="stat-card__number" id="stat-upcoming">2</span>
              <span class="stat-card__label">Upcoming</span>
              <span class="stat-card__subtitle">Scheduled ahead</span>
            </div>
          </article>

          <article class="stat-card">
            <div class="stat-card__icon stat-card__icon--active" aria-hidden="true">
              <span class="stat-card__dot stat-card__dot--green"></span>
            </div>
            <div class="stat-card__content">
              <span class="stat-card__number" id="stat-active">1</span>
              <span class="stat-card__label">Active</span>
              <span class="stat-card__subtitle">Happening now</span>
            </div>
          </article>

          <article class="stat-card">
            <div class="stat-card__icon stat-card__icon--completed" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </div>
            <div class="stat-card__content">
              <span class="stat-card__number" id="stat-completed">2</span>
              <span class="stat-card__label">Completed</span>
              <span class="stat-card__subtitle">Finished bookings</span>
            </div>
          </article>

          <article class="stat-card">
            <div class="stat-card__icon stat-card__icon--cancelled" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </div>
            <div class="stat-card__content">
              <span class="stat-card__number" id="stat-cancelled">1</span>
              <span class="stat-card__label">Cancelled</span>
              <span class="stat-card__subtitle">Called off</span>
            </div>
          </article>
        </section>

        <!-- Filter tabs + table search -->
        <div class="filter-bar">
          <div class="filter-tabs" role="tablist" aria-label="Filter bookings by status">
            <button type="button" class="filter-tabs__tab filter-tabs__tab--active" data-filter="all" role="tab" aria-selected="true">All</button>
            <button type="button" class="filter-tabs__tab" data-filter="upcoming" role="tab" aria-selected="false">Upcoming</button>
            <button type="button" class="filter-tabs__tab" data-filter="active" role="tab" aria-selected="false">Active</button>
            <button type="button" class="filter-tabs__tab" data-filter="completed" role="tab" aria-selected="false">Completed</button>
            <button type="button" class="filter-tabs__tab" data-filter="cancelled" role="tab" aria-selected="false">Cancelled</button>
          </div>

          <div class="filter-bar__search">
            <span class="filter-bar__search-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
            </span>
            <input
              type="search"
              id="booking-search"
              class="filter-bar__search-input"
              placeholder="Search bookings..."
              aria-label="Search bookings"
            />
          </div>
        </div>

        <!-- Bookings table card -->
        <section class="booking-table-card">
          <div class="booking-table-card__scroll">
            <table class="booking-table">
              <thead>
                <tr>
                  <th>Booking ID</th>
                  <th>User</th>
                  <th>Space</th>
                  <th>Date</th>
                  <th>Start Time</th>
                  <th>End Time</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="booking-table-body">
                <!-- Rows rendered by script.js -->
              </tbody>
            </table>
          </div>

          <footer class="booking-table-card__footer">
            <span class="booking-table-card__count" id="booking-count">Showing 6 bookings</span>
            <span class="booking-table-card__date-range">May 15 – May 21, 2025</span>
          </footer>
        </section>
      </main>
    </div>
  </div>

  <!-- New Booking Modal -->
  <div class="modal" id="booking-modal" aria-hidden="true" role="dialog" aria-labelledby="modal-title">
    <div class="modal__backdrop" id="modal-backdrop"></div>
    <div class="modal__dialog">
      <h3 class="modal__title" id="modal-title">New Booking</h3>

      <form id="booking-form" class="modal__form">
        <div class="form-field">
          <label class="form-field__label" for="field-user">User Name</label>
          <input type="text" id="field-user" class="form-field__input" placeholder="Enter user name" required />
        </div>

        <div class="form-field">
          <label class="form-field__label" for="field-space">Space</label>
          <select id="field-space" class="form-field__input form-field__select" required>
            <option value="">Select a room</option>
            <option value="Meeting Room A-101">Meeting Room A-101</option>
            <option value="Room B-204">Room B-204</option>
            <option value="Conference Room C-301">Conference Room C-301</option>
            <option value="Room D-404">Room D-404</option>
            <option value="Multipurpose Hall M-01">Multipurpose Hall M-01</option>
          </select>
        </div>

        <div class="form-field">
          <label class="form-field__label" for="field-date">Date</label>
          <input type="date" id="field-date" class="form-field__input" required />
        </div>

        <div class="form-field form-field--row">
          <div class="form-field">
            <label class="form-field__label" for="field-start">Start Time</label>
            <input type="time" id="field-start" class="form-field__input" required />
          </div>
          <div class="form-field">
            <label class="form-field__label" for="field-end">End Time</label>
            <input type="time" id="field-end" class="form-field__input" required />
          </div>
        </div>

        <div class="modal__actions">
          <button type="button" id="modal-cancel-btn" class="btn btn--ghost">Cancel</button>
          <button type="submit" class="btn btn--primary">Confirm</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Component scripts (inject sidebar & topbar) -->
  <script src="components/bookings-sidebar.js"></script>
  <script src="components/bookings-topbar.js"></script>
  <script src="bookings.js"></script>
  <script src="global-nav.js"></script>
</body>
</html>
